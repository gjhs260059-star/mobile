<!DOCTYPE html>
<!--
  NEON TETRIS v5.4-mobile — tetris_mobile_v5.4.html
  Mobile web port of NEON CYBERPUNK TETRIS v5.3 (tetris.py).
  Stage 1: core game (7-bag, NEXT 3, HOLD, ghost, lock delay, SRS, combo, B2B,
  T-spin, perfect clear, level mode) + touch controls + menus + settings.
  Stage 2: sprint 40 lines, TOP 5, detailed / cumulative stats, achievements,
  6 themes + custom theme, effects, sound settings (BGM / SFX), background image.
  Stage 3: replays - every game recorded (seeded GameCore re-simulation), list / player
  (0.5x~4x, seek bar, pause, step, ±5s), stored compressed in localStorage (max 30).
  Stage 4: online multiplayer (net_v5.4.js = tetris_net.py port, MQTT over wss) - lobby (nickname,
  room code create / join), waiting room (40 players, ready, host rules presets + per-player limits),
  attacks / garbage / offset / target, elimination, ranking, spectate panel (multi_v5.4.js).
  Files: core_v5.4.js (game logic, window.NT) · stores_v5.4.js (records / stats / achievements)
         themes_v5.4.js (themes + block styles) · effects_v5.4.js (particles / banners)
         audio_v5.4.js (Web Audio SFX + BGM) · calib_v5.4.js (감도 찾기) · ui_v5.4.js (canvas / input / menus) · style_v5.4.css
         replay_v5.4.js (recorder / store / player / replay pages)
         net_v5.4.js (multiplayer network) · multi_v5.4.js (lobby / waiting room / versus / spectate)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14151F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>NEON TETRIS v5.4 모바일</title>
<link rel="stylesheet" href="style_v5.4.css">
</head>
<body>
<div id="app">
  <div id="game">
    <div id="top">
      <div id="boardWrap"><canvas id="board"></canvas><canvas id="fxCv"></canvas></div>
      <div id="side">
        <!-- 관전 패널 (stage 4 에서 채워짐) - 상대 점수는 표시하지 않음 -->
        <div id="spec" class="panel">
          <canvas id="specCv"></canvas>
          <div class="specNav">
            <button id="specPrev" aria-label="이전 상대">◀</button>
            <span id="specName">👁 상대 화면</span>
            <button id="specNext" aria-label="다음 상대">▶</button>
          </div>
        </div>
        <div id="pv">
          <div class="panel cyan" id="nextBox"><div class="plabel cyan">NEXT</div><canvas id="nextCv"></canvas></div>
          <div class="panel" id="holdBox"><div class="plabel pink">HOLD</div><canvas id="holdCv"></canvas></div>
        </div>
        <div class="panel" id="statsBox">
          <div class="modeTitle" id="vMode">TETRIS</div>
          <div class="stat big"><span class="k">SCORE</span><span class="v" id="vScore">0</span></div>
          <div class="stat best"><span class="k" id="kBest">BEST</span><span class="v" id="vBest">0</span></div>
          <div class="stat"><span class="k">LINES</span><span class="v" id="vLines">0</span></div>
          <div class="stat" id="rowLevel"><span class="k" id="kLevel">LEVEL</span><span class="v" id="vLevel">-</span></div>
          <div class="stat"><span class="k">TIME</span><span class="v" id="vTime">0:00.00</span></div>
          <div class="stat"><span class="k">APM</span><span class="v" id="vApm">0</span></div>
        </div>
        <div id="mini">
          <button class="mbtn pink" id="bHold">HOLD</button>
          <button class="mbtn" id="bSoft">▼<small>소프트</small></button>
          <button class="mbtn" id="bCcw">↺<small>반시계</small></button>
          <button class="mbtn pink" id="bPause">Ⅱ<small>일시정지</small></button>
          <button class="mbtn target" id="bTarget">🎯 무작위<small>공격 대상</small></button>
        </div>
      </div>
    </div>
    <div id="status"></div>
    <div id="controls">
      <button class="bigbtn" id="bLeft" aria-label="왼쪽 이동">◀</button>
      <button class="bigbtn wide" id="bRot">회전</button>
      <button class="bigbtn" id="bRight" aria-label="오른쪽 이동">▶</button>
    </div>
  </div>
</div>

<!-- 메인 메뉴 -->
<div class="page show" id="pgMenu">
  <div style="flex:1 1 0"></div>
  <h1 class="title cyan">NEON</h1>
  <h1 class="title pink">TETRIS</h1>
  <div class="sub best" id="menuBest">BEST 0 | SPRINT -- | 🏆 0/0</div>
  <div class="sub" id="menuSub">v5.4-mobile</div>
  <div class="menuBtns">
    <button class="btn" id="mClassic">일반 모드</button>
    <button class="btn pink" id="mLevel">레벨업 모드: ON</button>
    <button class="btn" id="mSprint">스프린트 모드 (40줄)</button>
    <button class="btn" id="mStats">기록 및 통계</button>
    <button class="btn" id="mMulti">멀티플레이 (온라인 대전)</button>
    <button class="btn" id="mReplay">리플레이</button>
    <button class="btn" id="mAch">업적</button>
    <button class="btn" id="mTheme">스킨 및 테마</button>
    <button class="btn" id="mSettings">설정</button>
  </div>
  <div style="flex:1 1 0"></div>
  <div class="sub">좌우 드래그 = 이동 · 아래로 스와이프 = 즉시 낙하 · 보드 탭 = 회전</div>
</div>

<!-- 일시정지 -->
<div class="page dim" id="pgPause">
  <div class="card">
    <h2 style="color:var(--cyan)" id="pauseTitle">PAUSED</h2>
    <div class="res" id="pauseInfo"></div>
    <button class="btn" id="pResume">▶ 계속하기</button>
    <button class="btn" id="pRestart">새 게임</button>
    <button class="btn pink" id="pMenu">☰ 메뉴</button>
  </div>
</div>

<!-- 게임 오버 -->
<div class="page dim" id="pgOver">
  <div class="card">
    <h2 style="color:var(--pink)" id="overTitle">GAME OVER</h2>
    <div class="res" id="overInfo"></div>
    <button class="btn" id="oResult">📊 결과</button>
    <button class="btn" id="oReplay" style="display:none">🎬 리플레이</button>
    <button class="btn" id="oWatch" style="display:none">👁 관전 계속</button>
    <button class="btn" id="oAgain">다시 하기</button>
    <button class="btn pink" id="oMenu">☰ 메뉴</button>
  </div>
</div>

<!-- 설정 -->
<div class="page" id="pgSettings">
  <div class="hdr"><h2>설정</h2><button class="btn pink" id="sBack">← 뒤로</button></div>
  <div id="settingsBody" style="display:contents"></div>
</div>

<!-- 기록 및 통계 / 결과 / 업적 / 테마 (ui_v5.4.js 가 채움) -->
<div class="page" id="pgView">
  <div class="hdr"><h2 id="vTitle"></h2><button class="btn pink" id="vBack">← 메뉴</button></div>
  <div class="hline"></div>
  <div id="viewBody" class="vbody"></div>
</div>

<input type="file" id="bgFile" accept="image/*" style="display:none">
<div id="ver">v5.4-mobile</div>

<script src="core_v5.4.js"></script>
<script src="stores_v5.4.js"></script>
<script src="themes_v5.4.js"></script>
<script src="effects_v5.4.js"></script>
<script src="audio_v5.4.js"></script>
<script src="calib_v5.4.js"></script>
<script src="ui_v5.4.js"></script>
<script src="replay_v5.4.js"></script>
<script src="net_v5.4.js"></script>
<script src="multi_v5.4.js"></script>
</body>
</html>
